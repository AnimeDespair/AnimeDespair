name: Build Android APK
on:
  push:
    branches:
      - main
      - dating-lookup-overlay
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run URL unit test
        run: |
          mkdir -p /tmp/lookup-url-test
          javac -d /tmp/lookup-url-test app/src/main/java/dev/animedespair/lookupbubble/SearchUrls.java tests/TestSearchUrls.java
          java -cp /tmp/lookup-url-test TestSearchUrls
      - name: Install Android SDK platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lookup-bubble-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk lookup-bubble-debug.apk
          gh release create "$GITHUB_REF_NAME" lookup-bubble-debug.apk --generate-notes --title "$GITHUB_REF_NAME"
